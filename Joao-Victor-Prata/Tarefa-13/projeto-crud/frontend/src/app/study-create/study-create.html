<div class="d-flex justify-content-center align-items-center vh-100">
  <form class="bg-white rounded-4 shadow p-4 w-50" style="height: 50vh;" [formGroup]="studyForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Conteúdo</label>
      <input type="text" class="form-control" id="conteudo" formControlName="conteudo" maxlength="255">
    </div>

    <div class="mb-3">
      <label class="form-label">Anotações</label>
      <input type="text" class="form-control" id="anotacoes" formControlName="anotacoes" maxlength="1000">
    </div>

    <div class="mb-3">
      <label class="form-label">Matéria</label>
      <select id="materia" class="form-select" formControlName="materia">
        <option value="">Escolher...</option>
        <option value="Português">Português</option>
        <option value="Inglês">Inglês</option>
        <option value="Arte">Arte</option>
        <option value="Educação Física">Educação Física</option>
        <option value="Matemática">Matemática</option>
        <option value="Ciências">Ciências</option>
        <option value="Geografia">Geografia</option>
        <option value="História">História</option>
        <option value="Ensino Religioso">Ensino Religioso</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="studyForm.invalid">Salvar</button>
  </form>
</div>
