<div class="d-flex justify-content-center align-items-center">
  <form class="bg-white rounded-4 shadow p-4 w-50" [formGroup]="studyForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Conteúdo</label>
      <input type="text" class="form-control" id="conteudo" formControlName="conteudo" maxlength="255">
    </div>

    <div class="mb-3">
      <label class="form-label">Anotações</label>
      <textarea type="text" class="form-control" style="height: 100px; min-height: 100px; max-height: 380px;" id="anotacoes" formControlName="anotacoes" maxlength="1000"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Matéria</label>
      <select id="materia" class="form-select" formControlName="materia">
        <option value="">Escolher...</option>
        <option value="Português">Português</option>
        <option value="Inglês">Inglês</option>
        <option value="Arte">Arte</option>
        <option value="Educação Física">Educação Física</option>
        <option value="Matemática">Matemática</option>
        <option value="Ciências">Ciências</option>
        <option value="Geografia">Geografia</option>
        <option value="História">História</option>
        <option value="Ensino Religioso">Ensino Religioso</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Professor(a)</label>
      <input type="text" class="form-control" id="professor" formControlName="professor" maxlength="1000">
    </div>

    <div class="mb-3">
      <label class="form-label">Dificuldade</label>
      <select id="dificuldade" class="form-select" formControlName="dificuldade">
        <option [ngValue]="-1">Escolher...</option>
        <option [ngValue]="1">Muito fácil</option>
        <option [ngValue]="2">Fácil</option>
        <option [ngValue]="3">Médio</option>
        <option [ngValue]="4">Difícil</option>
        <option [ngValue]="5">Muito difícil</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="studyForm.invalid" id="toastTrigger">Salvar</button>
    
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="toastAlert" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
          <img src="..." class="rounded me-2" alt="...">
          <strong class="me-auto">Bootstrap</strong>
          <small>11 mins ago</small>
          <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body">
          Hello, world! This is a toast message.
        </div>
      </div>
    </div>
  </form>
</div>
