@if (!dadosSalvos) {
  <div class="form-text">
    <h1>Complete seus dados</h1>
    <p>Preencha seus dados pessoais para realizar seu cadastro.</p>
  </div>

  <form>
      <button>
      Enviar
      </button>
  </form>

} @else {
  <div class="result">
    <h1>Dados enviados com sucesso!</h1>
  </div>

  <button>
    Fazer outro envio
  </button>
}
