<form #userForm="ngForm" (ngSubmit)="onSubmit(userForm)">
  <div>
    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      name="email"
      ngModel
      required
      email
      #email="ngModel"
    />
  </div>

  <div>
    <label for="password">Senha</label>
    <input
      id="password"
      type="email"
      name="password"
      ngModel
      required
      minlength="6"
      maxlength="55"
      #password="ngModel"
      />
  </div>
  <button class="button">Login</button>

  @if (email.touched && email.dirty && email.invalid){
    <p class="control-error">
      E-mail inválido. Por favor, tente novamente. 
    </p>
  }

  @if (password.touched && password.dirty && password.invalid){
    <p class="control-error">
      Senha inválida. Por favor, tente novamente. 
    </p>
  }

  

</form>
